<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Global Shop</title>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; }
        /* 隐藏 Google 默认的丑框 */
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        
        /* 翻译选择器样式 */
        #google_translate_element { margin-bottom: 15px; text-align: center; }
        
        .flash-sale { background: linear-gradient(90deg, #ff4400, #ff8800); color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .product-info { padding: 10px; }
        .myr-price { color: #ff4400; font-weight: bold; font-size: 17px; }
        .wa-btn { display: block; background: #25D366; color: white; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>

    <div class="flash-sale">
        <div style="font-size: 12px;">🔥 限时秒杀倒计时 / Flash Sale Countdown:</div>
        <div id="timer" style="font-weight:bold; font-size:18px;">02:45:00</div>
    </div>

    <div id="gallery" class="product-grid">同步数据中...</div>

    <script>
        // 初始化 Google 翻译
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'zh-CN',
                includedLanguages: 'en,ms,zh-CN',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }

        const CSV_FILE = 'myshop.csv'; 
        let allProducts = [];

        window.onload = async function() {
            startTimer();
            try {
                const response = await fetch(CSV_FILE);
                const text = await response.text();
                parseData(text);
            } catch (err) { console.error("CSV Load Error"); }
        };

        function parseData(text) {
            const lines = text.split(/\r?\n/);
            allProducts = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if (parts && parts.length >= 3) {
                    const rmb = parseFloat(parts[1].replace(/"/g, "").replace(/[¥,]/g, "")) || 0;
                    allProducts.push({
                        title: parts[0].replace(/"/g, ""),
                        price: (rmb * 0.65) + 10,
                        img: parts[2].replace(/"/g, ""),
                        desc: (parts[4] ? parts[4].replace(/"/g, "") : "")
                    });
                }
            }
            render();
        }

        function render() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = allProducts.map((p, idx) => `
                <div class="product-card">
                    <img src="${p.img}" class="product-img">
                    <div class="product-info">
                        <div style="font-size:13px; height:36px; overflow:hidden;">${p.title}</div>
                        <div class="myr-price">RM ${p.price.toFixed(2)}</div>
                        <div style="font-size:11px; color:#999; margin:5px 0;">${p.desc}</div>
                        <a href="https://wa.me/601116008366?text=Order:${encodeURIComponent(p.title)}" class="wa-btn">WhatsApp 下单</a>
                    </div>
                </div>
            `).join('');
        }

        function startTimer() {
            let h=2, m=45, s=0;
            setInterval(() => {
                if(--s<0){s=59; if(--m<0){m=59; h--;}}
                document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }
    </script>
</body>
</html>
